spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/payflow;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  h2.console.enabled: true
server.port: ${PORT:8080}
springdoc.swagger-ui.path: /swagger-ui.html
payflow:
  webhook-secret: ${WEBHOOK_SECRET:whsec_demo_payflow}
  jwt-secret: ${JWT_SECRET:payflow-development-jwt-secret-change-this-in-production-2026}
  jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
