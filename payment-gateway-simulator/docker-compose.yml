services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports: ["5432:5432"]
    volumes: ["payflow_data:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payflow
      DB_USER: payflow
      DB_PASSWORD: payflow
      DB_DRIVER: org.postgresql.Driver
      CORS_ORIGIN: http://localhost:5173
    ports: ["8080:8080"]
    depends_on: [postgres]
  frontend:
    build: ./frontend
    environment: ["VITE_API_URL=http://localhost:8080/api/v1"]
    ports: ["5173:5173"]
    depends_on: [backend]
volumes: {payflow_data: {}}
