spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wealth}
    username: ${DB_USER:wealth}
    password: ${DB_PASSWORD:wealth}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
app:
  jwt-secret: ${JWT_SECRET:replace-this-development-only-secret-with-32-or-more-characters}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
